name: YT Cutter • Release Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: YT Cutter • Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze lib
      - run: flutter build apk --release
      - name: Dosyalari adlandir
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/YT-Cutter-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Cutter-Android
          path: release/*.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release/*.apk

  windows:
    name: YT Cutter • Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze lib
      - run: flutter build windows --release
      - name: Windows ZIP hazirla
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath YT-Cutter-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Cutter-Windows
          path: YT-Cutter-Windows-x64.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: YT-Cutter-Windows-x64.zip
